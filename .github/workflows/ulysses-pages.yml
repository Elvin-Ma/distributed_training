name: Deploy Ulysses HTML to Pages

on:
  push:
    branches:
      - main
    paths:
      - Long-Sequence/ulysses/**       # 触发范围改为目录下所有文件
      - .github/workflows/ulysses-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare site
        run: |
          mkdir -p _site/Long-Sequence/ulysses
          # 复制整个 ulysses 导出目录（包括 assets）
          cp -a Long-Sequence/ulysses/. _site/Long-Sequence/ulysses/
          # 禁用 Jekyll 以保留以 _ 开头的文件/目录（如需要）
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4