name: Deploy Ulysses HTML to Pages

on:
  push:
    branches:
      - main
    paths:
      - Long-Sequence/ulysses/ulysses.html
      - .github/workflows/ulysses-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare site
        run: |
          mkdir -p _site/Long-Sequence/ulysses
          cp Long-Sequence/ulysses/ulysses.html _site/Long-Sequence/ulysses/ulysses.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
