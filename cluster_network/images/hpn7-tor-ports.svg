<text x="36" y="48" font-size="28" fill="#183249" font-weight="700">02 / 单台 ToR：128 个 400G 物理口如何分配</text>
<text x="36" y="81" font-size="16" fill="#52677b" font-weight="400">D/U 表示下联/上联逻辑标签；P 表示示意物理口；breakout 子口以 .a / .b 标记。</text>
