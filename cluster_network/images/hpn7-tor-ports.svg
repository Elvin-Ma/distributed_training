<text x="72" y="174" font-size="18" fill="#087f8c" font-weight="700">51.2T ToR · 128 × 400G</text>
<text x="72" y="198" font-size="15" fill="#183249" font-weight="400">下联 P1…P68：68 × 400G = 136 × 200G 子口；上联 P69…P128：60 × 400G</text>
