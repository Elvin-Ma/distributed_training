<text x="60" y="419" font-size="18" fill="#087f8c" font-weight="400">■ P1…P64：128 个活跃子口</text>
<text x="470" y="419" font-size="18" fill="#986014" font-weight="400">■ P65…P68：8 个备用子口</text>
<text x="865" y="419" font-size="18" fill="#7451b8" font-weight="400">■ P69…P128：上联</text>
<path d="M65 465l16 -12h312l-16 12Z" fill="#087f8c" opacity=".24"/><path d="M377 465l16 -12v77l-16 12Z" fill="#087f8c" opacity=".48"/>
<rect x="65" y="465" width="312" height="77" rx="8" fill="#fff" stroke="#087f8c"/>
<text x="77" y="492" font-size="18" fill="#087f8c" font-weight="700">P1 / 400G → 2 × 200G</text>
<text x="77" y="516" font-size="15" fill="#183249" font-weight="400">P1.a → H1；P1.b → H2</text>
<path d="M430 465l16 -12h312l-16 12Z" fill="#087f8c" opacity=".24"/><path d="M742 465l16 -12v77l-16 12Z" fill="#087f8c" opacity=".48"/>
<rect x="430" y="465" width="312" height="77" rx="8" fill="#fff" stroke="#087f8c"/>
<text x="442" y="492" font-size="18" fill="#087f8c" font-weight="700">P68 / 400G → 2 × 200G</text>
<text x="442" y="516" font-size="15" fill="#183249" font-weight="400">P68.a → H135；.b → H136</text>
<path d="M798 465l16 -12h332l-16 12Z" fill="#7451b8" opacity=".24"/><path d="M1130 465l16 -12v77l-16 12Z" fill="#7451b8" opacity=".48"/>
<rect x="798" y="465" width="332" height="77" rx="8" fill="#fff" stroke="#7451b8"/>
<text x="810" y="492" font-size="18" fill="#7451b8" font-weight="700">Uj = P(68+j) / 400G</text>
<text x="810" y="516" font-size="15" fill="#183249" font-weight="400">U1 → Agg1；U60 → Agg60</text>
<rect x="36" y="574" width="1128" height="138" rx="8" fill="#eaf0f7" stroke="#d6e1ec"/>
<text x="52" y="603" font-size="17" fill="#183249" font-weight="400">任意主机 Hₕ：Dₕ = P⌈h/2⌉ 的 .a（h 奇数）或 .b（h 偶数）；同一 ToR 上对应同号 NIC。</text>
<text x="52" y="630" font-size="17" fill="#183249" font-weight="400">下联装机容量：136 × 200G = 27.2T；活跃容量：128 × 200G = 25.6T；上联：60 × 400G = 24T。</text>
<text x="52" y="657" font-size="17" fill="#183249" font-weight="400">物理口预算：68 + 60 = 128；活跃接入超售比：25.6 / 24 ≈ 1.067:1（含备用为 1.133:1）。</text>
<text x="52" y="684" font-size="17" fill="#183249" font-weight="400">彩色小格按物理口逐个绘制；本图分配方案用于解释数量，不代表厂商面板排列或现场布线号。</text>
<text x="36" y="760" font-size="14" fill="#52677b" font-weight="400">HPN 7.0 · 端口编号为本文示意编号；G/T = Gbit/s / Tbit/s；带宽按单方向相加。</text>
</svg>
