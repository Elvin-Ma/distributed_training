<text x="52" y="798" font-size="17" fill="#183249" font-weight="400">每条彩线 = 当前主机的一条 200G 链路；每台 ToR 接收全部 136 台主机的同号 NIC 端口。</text>
<text x="52" y="825" font-size="17" fill="#183249" font-weight="400">每主机：8 NIC × 2 × 200G = 3.2T；每 Segment：136 × 16 = 2,176 条 200G 接入链路。</text>
<text x="52" y="852" font-size="17" fill="#183249" font-weight="400">同 rail 跨主机：NICᵣ → ToR₂ᵣ（或 ToR₂ᵣ₊₁）→ NICᵣ；一条 rail 对应 128 张活跃 GPU。</text>
<text x="52" y="879" font-size="17" fill="#183249" font-weight="400">跨 rail 可利用机内 NVLink 换轨；ToR 之间无直连。每台 ToR 另有 60 × 400G 上联，见图 02/03。</text>
<text x="36" y="920" font-size="14" fill="#52677b" font-weight="400">HPN 7.0 · 端口编号为本文示意编号；G/T = Gbit/s / Tbit/s；带宽按单方向相加。</text>
</svg>
