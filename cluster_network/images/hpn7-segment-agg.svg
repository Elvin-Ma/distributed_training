<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">03 / Segment → Agg：一根链路的两端端口</title><desc id="desc">只展开平面 A；平面 B 使用完全相同的规则，独立连接到 AggB1…AggB60。</desc>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif} .wire{fill:none;stroke-linejoin:round;stroke-linecap:round}</style>
<rect width="1200" height="900" fill="#f5f8fc"/>
<text x="36" y="48" font-size="28" fill="#183249" font-weight="700">03 / Segment → Agg：一根链路的两端端口</text>
<text x="36" y="81" font-size="16" fill="#52677b" font-weight="400">只展开平面 A；平面 B 使用完全相同的规则，独立连接到 AggB1…AggB60。</text>
<path d="M45 155l16 -12h350l-16 12Z" fill="#087f8c" opacity=".24"/><path d="M395 155l16 -12v84l-16 12Z" fill="#087f8c" opacity=".48"/>
<rect x="45" y="155" width="350" height="84" rx="8" fill="#fff" stroke="#087f8c"/>
<text x="57" y="182" font-size="18" fill="#087f8c" font-weight="700">Segment s · ToR A[s,r]</text>
<text x="57" y="206" font-size="15" fill="#183249" font-weight="400">s = 1…15；r = 0…7；A[s,r] = ToR₂ᵣ</text>
<path d="M794 155l16 -12h350l-16 12Z" fill="#087f8c" opacity=".24"/><path d="M1144 155l16 -12v84l-16 12Z" fill="#087f8c" opacity=".48"/>
<rect x="794" y="155" width="350" height="84" rx="8" fill="#fff" stroke="#087f8c"/>
<text x="806" y="182" font-size="18" fill="#087f8c" font-weight="700">AggAⱼ · j = 1…60</text>
<text x="806" y="206" font-size="15" fill="#183249" font-weight="400">下联 D1…D120；上联 C1…C8</text>
<polyline class="wire" points="395,199 794,199" stroke="#087f8c" stroke-width="5"/>
<text x="420" y="175" font-size="18" fill="#087f8c" font-weight="700">Uj ↔ D[8×(s−1)+r+1] · 400G</text>
<text x="446" y="226" font-size="17" fill="#183249" font-weight="400">每一对 ToR–Agg 恰好一根线</text>
<rect x="45" y="277" width="1099" height="69" rx="8" fill="#e4f2f2" stroke="#d6e1ec"/>
<text x="63" y="305" font-size="20" fill="#087f8c" font-weight="700">具体例子：Segment 2 的 ToR6（r=3），上联 U5 ↔ AggA5 的下联 D12。</text>
<text x="63" y="330" font-size="17" fill="#183249" font-weight="400">计算：8 × (2−1) + 3 + 1 = 12；该链路两端均为 400G。</text>
<text x="45" y="392" font-size="21" fill="#183249" font-weight="700">从一台 ToR 看：60 个上联口</text>
<path d="M55 440l16 -12h335l-16 12Z" fill="#087f8c" opacity=".24"/><path d="M390 440l16 -12v66l-16 12Z" fill="#087f8c" opacity=".48"/>
<rect x="55" y="440" width="335" height="66" rx="8" fill="#fff" stroke="#087f8c"/>
<text x="67" y="467" font-size="18" fill="#087f8c" font-weight="700">AggA1</text>
<text x="67" y="491" font-size="15" fill="#183249" font-weight="400">ToR 的 U1 → 本 Agg 的同一个 Dₖ</text>
<path d="M423 440l16 -12h335l-16 12Z" fill="#087f8c" opacity=".24"/><path d="M758 440l16 -12v66l-16 12Z" fill="#087f8c" opacity=".48"/>
<rect x="423" y="440" width="335" height="66" rx="8" fill="#fff" stroke="#087f8c"/>
<text x="435" y="467" font-size="18" fill="#087f8c" font-weight="700">AggA2</text>
<text x="435" y="491" font-size="15" fill="#183249" font-weight="400">ToR 的 U2 → 本 Agg 的同一个 Dₖ</text>
<path d="M791 440l16 -12h335l-16 12Z" fill="#087f8c" opacity=".24"/><path d="M1126 440l16 -12v66l-16 12Z" fill="#087f8c" opacity=".48"/>
<rect x="791" y="440" width="335" height="66" rx="8" fill="#fff" stroke="#087f8c"/>
<text x="803" y="467" font-size="18" fill="#087f8c" font-weight="700">AggA60</text>
<text x="803" y="491" font-size="15" fill="#183249" font-weight="400">ToR 的 U60 → 本 Agg 的同一个 Dₖ</text>
<text x="58" y="540" font-size="19" fill="#183249" font-weight="400">U1…U60 → AggA1…AggA60；60 条 × 400G = 24T，覆盖本平面全部 Agg。</text>
<text x="45" y="590" font-size="21" fill="#183249" font-weight="700">从一台 Agg 看：每个 Segment 占 8 个下联口</text>
<path d="M55 631l16 -12h335l-16 12Z" fill="#087f8c" opacity=".24"/><path d="M390 631l16 -12v69l-16 12Z" fill="#087f8c" opacity=".48"/>
<rect x="55" y="631" width="335" height="69" rx="8" fill="#fff" stroke="#087f8c"/>
<text x="67" y="658" font-size="18" fill="#087f8c" font-weight="700">Segment 1 · 8 台 ToR</text>
<text x="67" y="682" font-size="15" fill="#183249" font-weight="400">D1…D8 ↔ rail 0…7</text>
<path d="M423 631l16 -12h335l-16 12Z" fill="#087f8c" opacity=".24"/><path d="M758 631l16 -12v69l-16 12Z" fill="#087f8c" opacity=".48"/>
<rect x="423" y="631" width="335" height="69" rx="8" fill="#fff" stroke="#087f8c"/>
<text x="435" y="658" font-size="18" fill="#087f8c" font-weight="700">Segment 2 · 8 台 ToR</text>
<text x="435" y="682" font-size="15" fill="#183249" font-weight="400">D9…D16 ↔ rail 0…7</text>
<path d="M791 631l16 -12h335l-16 12Z" fill="#087f8c" opacity=".24"/><path d="M1126 631l16 -12v69l-16 12Z" fill="#087f8c" opacity=".48"/>
<rect x="791" y="631" width="335" height="69" rx="8" fill="#fff" stroke="#087f8c"/>
<text x="803" y="658" font-size="18" fill="#087f8c" font-weight="700">Segment 15 · 8 台 ToR</text>
<text x="803" y="682" font-size="15" fill="#183249" font-weight="400">D113…D120 ↔ rail 0…7</text>
<rect x="36" y="735" width="1128" height="111" rx="8" fill="#eaf0f7" stroke="#d6e1ec"/>
<text x="52" y="764" font-size="17" fill="#183249" font-weight="400">每 Segment / 每平面：8 ToR × 60 Agg = 480 条 400G；双平面合计 960 条，容量 384T。</text>
<text x="52" y="791" font-size="17" fill="#183249" font-weight="400">每 Agg：15 Segment × 8 = 120 下联口（48T）；再加 8 个 Core 上联口（3.2T）= 128 口。</text>
<text x="52" y="818" font-size="17" fill="#183249" font-weight="400">Agg 为 Pod 内所有 Segment 共享；Segment 之间经 Agg 转发，没有 Segment 间专用直连线。</text>
<text x="36" y="880" font-size="14" fill="#52677b" font-weight="400">HPN 7.0 · 端口编号为本文示意编号；G/T = Gbit/s / Tbit/s；带宽按单方向相加。</text>
</svg>
